<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <linearGradient id="iconBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1524" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
  </defs>

  <!-- Clean Minimalist Frame -->
  <rect width="1200" height="300" rx="16" fill="url(#bannerBg)" stroke="#1a2333" stroke-width="1.5" />

  <!-- Left: The Mathematical C+ Monogram Squircle -->
  <g transform="translate(75, 40)">
    <rect width="220" height="220" rx="50" fill="url(#iconBg)" />
    <rect width="218" height="218" x="1" y="1" rx="49" fill="none" stroke="#223048" stroke-width="1.5" />

    <g transform="scale(0.4296875)">
      <!-- C Glyph -->
      <path d="M 356.102 146.398 A 155.000 155.000 0 1 0 356.102 365.602 L 320.746 330.254 A 105.000 105.000 0 1 1 320.746 181.746 Z" fill="#ffffff" />
      <!-- + Glyph -->
      <rect x="288.50" y="242.00" width="132.00" height="28.00" rx="2.5" fill="#16e1e5" />
      <rect x="340.50" y="190.00" width="28.00" height="132.00" rx="2.5" fill="#16e1e5" />
    </g>
  </g>

  <!-- Right: Pure, High-Impact Typography -->
  <g transform="translate(355, 0)">
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Liberation Sans', sans-serif" font-size="38" font-weight="300" fill="#e2e8f0" letter-spacing="-0.5">
      A modern,
    </text>
    <text x="0" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Liberation Sans', sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1.8">
      lightweight C library
    </text>
    <text x="0" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Liberation Sans', sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Extending C with modern capabilities
    </text>
  </g>
</svg>
